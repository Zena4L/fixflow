# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
# Production runs on PostgreSQL (Neon on Vercel). Vercel's containers are
# stateless, so the SQLite files used in development/test would be lost.
# DATABASE_URL is the pooled Neon URL; bin/docker-entrypoint migrates through
# DATABASE_URL_UNPOOLED, because migrations need session-level advisory locks.
production:
  primary:
    adapter: postgresql
    encoding: unicode
    url: <%= ENV["DATABASE_URL"] %>
    max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    # Neon's pooler (PgBouncer, transaction mode) cannot keep prepared statements.
    prepared_statements: false
