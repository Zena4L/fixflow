default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

# Production uses :memory_store (see production.rb). Solid Cache's model is
# still eager-loaded, so it must not point at a database that isn't configured.
production:
  <<: *default
